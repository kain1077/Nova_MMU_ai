name: Build release binaries

# PyInstaller cannot cross-compile -- a Windows .exe has to be produced on
# Windows and a macOS binary on macOS -- so the matrix is not an optimisation,
# it is the only way to get all four artifacts.
on:
  push:
    tags:
      - "v*"
  # Build and smoke-test on pull requests that touch what goes into a binary, so
  # a broken installer is caught in review rather than during a release. Scoped
  # by path deliberately: an ordinary PR should not spend four runners, and a
  # workflow that is slow on every change is one people learn to ignore.
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "mmu_mcp_server.py"
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - ".env.example"
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Create a draft release from the built binaries"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The suite lives in tests.yml, which runs on every pull request rather than
  # only the ones matching this workflow's paths filter. Called from here so a
  # tag build is still gated on it, and so there is one copy of those steps
  # instead of two that can drift apart.
  #
  # On a pull request that matches the paths above, this means the suite runs
  # twice: once from tests.yml's own pull_request trigger and once through this
  # call. That is one extra fifteen-second ubuntu job on a minority of PRs, and
  # it buys an unconditional gate that needs no `if:` gymnastics to read.
  test:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04     # oldest supported glibc; newer hosts still run it
            label: linux-x64
          # macos-13 was the obvious Intel label and was retired in December
          # 2025; naming it does not fail, it queues forever waiting for a
          # runner that no longer exists. macos-15-intel is the replacement, and
          # is the last x86_64 macOS image GitHub will offer -- it goes away in
          # August 2027, after which Intel Macs can only be served by building
          # elsewhere, or by letting Rosetta 2 run this binary on Apple silicon.
          - os: macos-15-intel   # Intel
            label: macos-x64
          - os: macos-14         # Apple silicon
            label: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r packaging/requirements-build.txt

      - name: Build binaries
        run: python packaging/build.py

      - name: Smoke-test the installer
        shell: bash
        env:
          MMU_NO_PAUSE: "1"
        run: |
          set -e
          binary=$(ls dist/mmu-setup-* | head -1)
          "$binary" --version
          # doctor exits non-zero when it finds problems, and on a runner with no
          # Docker it certainly will. We only care that it ran and reported.
          "$binary" doctor || true

      - name: Smoke-test the MCP bridge
        shell: bash
        run: |
          set -e
          binary=$(ls dist/mmu-mcp-* | head -1)
          # The bridge must answer tools/list without a server running; it is the
          # handshake a chat client performs before any memory call.
          request='{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
          echo "$request" | "$binary" > out.json 2>/dev/null || true
          grep -q "recall_memory" out.json
          echo "bridge advertises its tools"

      - uses: actions/upload-artifact@v4
        with:
          name: mmu-${{ matrix.label }}
          path: dist/mmu-*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        # Unsigned binaries downloaded over the internet deserve a way to be
        # verified. This is not a substitute for code signing; it is what we can
        # offer without a certificate.
        run: sha256sum mmu-* | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          generate_release_notes: true
